<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Molly API probe</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #141414; color: #eee; padding: 2rem; }
    input { padding: .4rem; width: 12rem; background: #222; color: #eee; border: 1px solid #444; }
    button { padding: .4rem 1rem; cursor: pointer; }
    pre { background: #1e1e1e; border: 1px solid #333; padding: 1rem; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Разведка API mollygacha.ru (через публичный CORS-прокси)</h2>
  <p>
    User ID: <input id="uid" value="945690716">
    <button onclick="run()">Загрузить</button>
  </p>
  <pre id="out">Нажми «Загрузить»…</pre>

<script>
  // Транспорт: публичный прокси. Позже заменим.
  const viaProxy = u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u);

  async function get(u) {
    const r = await fetch(viaProxy(u));
    if (!r.ok) throw new Error('proxy http ' + r.status);
    const j = await r.json();
    return JSON.parse(j.contents);
  }

  async function run() {
    const uid = document.getElementById('uid').value.trim();
    const out = document.getElementById('out');
    out.textContent = 'Загрузка…';
    try {
      const base = 'https://mollygacha.ru/api';
      const [profile, cards, coll, dormE, dormT] = await Promise.all([
        get(base + '/profile?user_id=' + uid),
        get(base + '/cards'),
        get(base + '/collection?user_id=' + uid),
        get(base + '/dormitory?user_id=' + uid + '&preset=default'),
        get(base + '/dormitory?user_id=' + uid + '&preset=paid')
      ]);
      const nameOf = id => {
        const c = cards.cards.find(x => x.id === id);
        return c ? c.name : ('#' + id);
      };
      const slotList = d => d.slots.filter(s => s.card_id).map(s => nameOf(s.card_id)).join(', ') || '(пусто)';
      out.textContent =
        'Игрок: ' + profile.name + ' | уровень ' + profile.level +
        ' | монеты ' + profile.coins + ' | реролл-токены ' + profile.reroll_tokens + '\n' +
        'Карт в справочнике: ' + cards.cards.length +
        ' | копий в коллекции: ' + coll.cards.length + '\n\n' +
        'Общага «Основной»: ' + slotList(dormE) + '\n' +
        'Общага «Тикеты»: ' + slotList(dormT) + '\n\n' +
        'Первые копии коллекции:\n' +
        coll.cards.slice(0, 10)
          .map(c => '  ' + c.name + ' | +' + c.upgrade_level + ' | качество #' + c.quality)
          .join('\n');
    } catch (e) {
      out.textContent = 'Ошибка: ' + e.message +
        '\n(если прокси лежит — попробуй ещё раз через минуту)';
    }
  }
</script>
</body>
</html>
